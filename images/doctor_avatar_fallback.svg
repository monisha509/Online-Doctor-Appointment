<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  <!-- Head -->
  <circle cx="100" cy="72" r="32" fill="#cbd5e1" />
  <!-- Body / Lab Coat -->
  <path d="M45,175 C45,125 70,115 100,115 C130,115 155,125 155,175 Z" fill="url(#coatGrad)" />
  <!-- Inner shirt -->
  <polygon points="100,115 88,140 112,140" fill="#0284c7" />
  <!-- Coat Lapels -->
  <path d="M78,118 L88,155 L70,175" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M122,118 L112,155 L130,175" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Stethoscope -->
  <path d="M85,120 C85,150 115,150 115,120" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M100,147 L100,160" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <circle cx="100" cy="164" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
</svg>
